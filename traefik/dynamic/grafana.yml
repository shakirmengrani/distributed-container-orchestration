
http:
  routers:
    grafana:
      rule: "PathPrefix(`/grafana`)"
      entryPoints:
        - websecure
      service: grafana-service
      middlewares:
        - content_compress
      tls:
        certResolver: httpresolver

  services:
    grafana-service:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
