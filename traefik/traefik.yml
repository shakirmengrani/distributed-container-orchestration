
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"

  metrics:
    address: ":8082"

api:
  insecure: true
  dashboard: true

metrics:
  prometheus: {}

providers:
  etcd:
    endpoints:
      - "etcd:2379"
    rootKey: "master/traefik"

  file:
    directory: "/etc/traefik/dynamic"
    watch: true

certificatesResolvers:
  httpresolver:
    acme:
      email: "webmaster@local"
      storage: "acme-http.json"
      httpChallenge:
        entryPoint: web
